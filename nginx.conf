# 北京联纵宸捷科技有限公司 - Nginx 部署配置
# 请将此文件中的配置复制到您的 Nginx 配置目录中

server {
    listen 80;
    server_name www.lianzongchenjie.com lianzongchenjie.com;
    
    # HTTP 强制跳转到 HTTPS (生产环境取消注释)
    # return 301 https://$server_name$request_uri;
    
    root /var/www/lianzong/dist;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # CMS 接口反向代理（配套 .env.production 中 VITE_API_BASE_URL 留空的方案）
    # 也可以把 proxy_pass 换成后台域名，如 https://admin.lianzongchenjie.com
    location /cms/ {
        proxy_pass http://127.0.0.1:48080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 路由回退 - 所有非静态文件请求回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长期缓存（带hash的文件名）
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 图片资源缓存
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 字体文件缓存
    location ~* \.(woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML 不缓存
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 禁止访问敏感文件
    location ~ /\. {
        deny all;
    }
}

